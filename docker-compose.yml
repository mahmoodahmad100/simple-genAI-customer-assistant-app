# Copy .env.example to .env before starting the stack.
# docker compose up starts the API and the Streamlit chat.
# Ollama starts only with: docker compose --profile ollama up

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./data:/data:ro

  ollama:
    image: ollama/ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
