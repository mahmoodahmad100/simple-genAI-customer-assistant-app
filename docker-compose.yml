# Copy .env.example to .env before starting the stack.
# The frontend service has no Dockerfile yet. Start the API with:
#   docker compose up backend

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    volumes:
      - ./data:/data:ro

  ollama:
    image: ollama/ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
